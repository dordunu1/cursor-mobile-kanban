name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'mobile-v*'

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build installable APK
        working-directory: mobile/android
        run: |
          # Debug-signed APK installs after enabling "Install unknown apps".
          ./gradlew assembleDebug --no-daemon

      - name: Stage APK
        run: |
          DEBUG_APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)
          cp "$DEBUG_APK" orbit-board.apk
          ls -lh orbit-board.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbit-board-apk
          path: mobile/orbit-board.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/orbit-board.apk
          generate_release_notes: true
          name: Orbit Board ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
